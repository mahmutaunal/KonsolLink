[package]
name = "konsollink-helper"
version = "1.0.0"
edition = "2021"
license = "GPL-3.0-only"

[dependencies]
konsollink-core = { path = "../crates/konsollink-core" }
konsollink-platform = { path = "../crates/konsollink-platform" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
pfctl = "=0.7.0"
